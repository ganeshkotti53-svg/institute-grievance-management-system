<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<link rel="stylesheet" href="auth.css">

<script>
function validateAdmin() {

    let email = document.forms["adminForm"]["email"].value;
    let password = document.forms["adminForm"]["password"].value;

    if(email == ""){
        alert("Enter Admin Email");
        return false;
    }

    if(password == ""){
        alert("Enter Password");
        return false;
    }

    return true;
}

document.addEventListener("DOMContentLoaded", function () {
    const errorMessages = {
        invalid_credentials: "Invalid email or password.",
        incomplete: "Please enter your email and password.",
        service: "Unable to sign in right now. Please try again."
    };
    const errorCode = new URLSearchParams(window.location.search).get("error");
    const errorBox = document.getElementById("login-error");

    if (errorMessages[errorCode]) {
        errorBox.textContent = errorMessages[errorCode];
        errorBox.hidden = false;
    }
});
</script>

</head>

<body class="auth-page">

<div class="container">

<div class="auth-brand">
    <span class="auth-brand-mark">I</span>
    <span>Institute Grievance Management<small>Administration portal</small></span>
</div>

<h2>Admin Login</h2>
<p class="auth-description">Sign in to manage and respond to student grievances.</p>

<div id="login-error" class="auth-error" role="alert" hidden></div>

<form name="adminForm"
      action="adminlogin.php"
      method="POST"
      onsubmit="return validateAdmin()">

<input type="email"
       name="email"
       placeholder="Admin Email"
       required>

<input type="password"
       name="password"
       placeholder="Password"
       required>

<input type="submit"
       value="Login">

</form>

<p class="bottom-text">
Student? <a href="login.html">Student Login</a>
</p>

</div>

</body>
</html>
